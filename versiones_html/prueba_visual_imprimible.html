    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 10px 24px;
      border-bottom: 1px solid #334155;
      z-index: 10;
    }

    .header-bar h2 {
      color: #38bdf8;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .header-bar p {
      color: #94a3b8;
      font-size: 0.8rem;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls button {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.82rem;

  <script>
    const viewport = document.getElementById('viewport');
    const panLayer = document.getElementById('panLayer');
    const zoomLevelEl = document.getElementById('zoomLevel');
    
    let scale = 1;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let isPanning = false;

    function updateTransform() {
      panLayer.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
      zoomLevelEl.textContent = `${Math.round(scale * 100)}%`;
    }

    function zoom(delta, clientX, clientY) {
      const rect = viewport.getBoundingClientRect();
      const cx = (clientX !== undefined ? clientX : rect.left + rect.width / 2) - rect.left;
      const cy = (clientY !== undefined ? clientY : rect.top + rect.height / 2) - rect.top;

      const prevScale = scale;
      scale *= delta;
      scale = Math.max(0.08, Math.min(scale, 6));

      pointX = cx - (cx - pointX) * (scale / prevScale);
      pointY = cy - (cy - pointY) * (scale / prevScale);
      updateTransform();
    }

    function zoomIn() { zoom(1.25); }
    function zoomOut() { zoom(0.8); }
    
    function resetView() {
      scale = 1;
      pointX = 0;
      pointY = 0;
      updateTransform();
    }

    function fitView() {
      const vw = viewport.clientWidth;
      const vh = viewport.clientHeight;
      scale = Math.min(vw / 7200, vh / 5400);
      pointX = (vw - 7200 * scale) / 2;
      pointY = (vh - 5400 * scale) / 2;
      updateTransform();
    }

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 1.15 : 0.85;
      zoom(delta, e.clientX, e.clientY);
    }, { passive: false });

    viewport.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isPanning = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
      viewport.classList.add('grabbing');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      viewport.classList.remove('grabbing');
    });

    window.addEventListener('load', fitView);
    window.addEventListener('resize', fitView);
  </script>
