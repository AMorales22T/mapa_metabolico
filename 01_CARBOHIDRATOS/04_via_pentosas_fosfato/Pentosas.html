<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vía de las Pentosas Fosfato - Mapa Metabólico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lienzo-svg {
      width: 1000px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.07);
      overflow: hidden;
    }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="lienzo-svg">
    <svg width="1000" height="1500" viewBox="0 0 1000 1500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Flecha de flujo metabólico principal (Naranja) -->
        <marker id="arrowFlow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M 0 0 L 6 3 L 0 6 Z" fill="#ea580c" />
        </marker>
        <!-- Flecha de poder reductor NADPH (Verde esmeralda / azulado) -->
        <marker id="arrowNADPH" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M 0 0 L 6 3 L 0 6 Z" fill="#059669" />
        </marker>
        <!-- Flecha de salida de reactivo o subproducto (Gris pizarra) -->
        <marker id="arrowSlate" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#475569" />
        </marker>
        <!-- Flecha de agua (Azul) -->
        <marker id="arrowBlue" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#0284c7" />
        </marker>
        <!-- Flecha violeta para precursores de nucleótidos -->
        <marker id="arrowPurple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M 0 0 L 6 3 L 0 6 Z" fill="#7c3aed" />
        </marker>
      </defs>

    <!-- Banner de Encabezado -->
    <g transform="translate(385, 40)">
      <rect x="-180" y="-14" width="360" height="28" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
      <text x="0" y="4" fill="#c2410c" font-size="12" font-weight="800" text-anchor="middle">VÍA DE LAS PENTOSAS FOSFATO (SHUNT HMP)</text>
    </g>
    

      <!-- Metabolito: Glucosa-6-Fosfato -->
      <g transform="translate(340, 90)">
        <g transform="translate(0, 0)">
          
  <!-- Anillo de piranosa (6 lados) -->
  <polygon points="50,22 72,36 50,58 16,58 0,36 16,22" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Oxígeno del anillo -->
  <circle cx="16" cy="22" r="7" fill="#ffffff"/>
  <text x="16" y="26" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">O</text>

  <!-- Carbono 6 con Grupo Fosfato destacado -->
  <line x1="0" y1="36" x2="0" y2="12" stroke="#0f172a" stroke-width="2.2"/>
  <circle cx="0" cy="-2" r="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="0" y="3" fill="#c2410c" font-size="12" font-weight="900" text-anchor="middle">Ⓟ</text>
  <text x="-20" y="2" fill="#ea580c" font-size="9" font-weight="700" text-anchor="end">O-PO₃²⁻</text>

  <!-- Grupos hidroxilo (-OH) -->
  <line x1="72" y1="36" x2="88" y2="36" stroke="#0f172a" stroke-width="2"/>
  <text x="98" y="40" fill="#0f172a" font-size="11" font-weight="700">OH</text>

  <line x1="50" y1="58" x2="50" y2="72" stroke="#0f172a" stroke-width="2"/>
  <text x="50" y="83" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">OH</text>

  <line x1="16" y1="58" x2="16" y2="72" stroke="#0f172a" stroke-width="2"/>
  <text x="16" y="83" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">HO</text>

  <line x1="0" y1="36" x2="-14" y2="36" stroke="#0f172a" stroke-width="2"/>
  <text x="-24" y="40" fill="#0f172a" font-size="11" font-weight="700">HO</text>

        </g>
        <g transform="translate(135, 25)">
          <text x="0" y="0" fill="#0f172a" font-size="17" font-weight="800" >Glucosa-6-Fosfato</text>
          <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" >6 Carbonos (Hexosa)</text>
          <text x="0" y="34" fill="#64748b" font-size="11" >Bifurcación lateral desde la Glucólisis</text>
        </g>
      </g>
    

    <!-- Reacción: Glucosa-6-P Deshidrogenasa (G6PDH) -->
    <g transform="translate(385, 200)">
      <line x1="0" y1="0" x2="0" y2="48" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrowFlow)"/>
      
        <!-- Entrada de NADP+ -->
        <path d="M -75 8 Q -25 8 -4 18" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
        <text x="-80" y="11" fill="#475569" font-size="11" font-weight="800" text-anchor="end">NADP⁺</text>
        <!-- Salida de NADPH + H+ -->
        <path d="M -4 24 Q -25 34 -75 34" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowNADPH)"/>
        <text x="-80" y="37" fill="#059669" font-size="11" font-weight="800" text-anchor="end">+ NADPH + H⁺</text>
        
      <g transform="translate(18, 12)">
        <text x="0" y="0" fill="#0f172a" font-size="12" font-weight="800">Glucosa-6-P Deshidrogenasa (G6PDH)</text>
        <text x="0" y="13" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">EC 1.1.1.49 (Paso Limitante Clave)</text>
        <text x="0" y="26" fill="#e11d48" font-size="10" font-weight="700">⊣ NADPH | ⊕ NADP⁺, Insulina</text>
      </g>
    </g>
    

      <!-- Metabolito: 6-Fosfoglucono-δ-Lactona -->
      <g transform="translate(340, 285)">
        <g transform="translate(0, 0)">
          
  <!-- Anillo de lactona de 6 vértices -->
  <polygon points="50,22 72,36 50,58 16,58 0,36 16,22" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Oxígeno éster intramolecular del anillo -->
  <circle cx="16" cy="22" r="7" fill="#ffffff"/>
  <text x="16" y="26" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">O</text>

  <!-- C1: Doble enlace carbonilo de la lactona (C=O) -->
  <line x1="72" y1="34" x2="88" y2="25" stroke="#0f172a" stroke-width="2"/>
  <line x1="74" y1="38" x2="90" y2="29" stroke="#0f172a" stroke-width="2"/>
  <text x="98" y="28" fill="#dc2626" font-size="13" font-weight="900">O</text>

  <!-- C6 con Grupo Fosfato -->
  <line x1="0" y1="36" x2="0" y2="12" stroke="#0f172a" stroke-width="2.2"/>
  <circle cx="0" cy="-2" r="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="0" y="3" fill="#c2410c" font-size="12" font-weight="900" text-anchor="middle">Ⓟ</text>
  <text x="-20" y="2" fill="#ea580c" font-size="9" font-weight="700" text-anchor="end">O-PO₃²⁻</text>

  <!-- Grupos hidroxilo en C2, C3 y C4 -->
  <line x1="50" y1="58" x2="50" y2="72" stroke="#0f172a" stroke-width="2"/>
  <text x="50" y="83" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">OH</text>

  <line x1="16" y1="58" x2="16" y2="72" stroke="#0f172a" stroke-width="2"/>
  <text x="16" y="83" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">HO</text>

  <line x1="0" y1="36" x2="-14" y2="36" stroke="#0f172a" stroke-width="2"/>
  <text x="-24" y="40" fill="#0f172a" font-size="11" font-weight="700">HO</text>

        </g>
        <g transform="translate(135, 25)">
          <text x="0" y="0" fill="#0f172a" font-size="17" font-weight="800" >6-Fosfoglucono-δ-Lactona</text>
          <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" >6 Carbonos (Lactona cíclica)</text>
          <text x="0" y="34" fill="#64748b" font-size="11" >Éster intramolecular inestable</text>
        </g>
      </g>
    

    <!-- Reacción: 6-Fosfogluconolactonasa -->
    <g transform="translate(385, 390)">
      <line x1="0" y1="0" x2="0" y2="48" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrowFlow)"/>
      
        <!-- Entrada de H2O -->
        <path d="M -75 14 Q -25 14 -4 24" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
        <text x="-80" y="17" fill="#0284c7" font-size="11" font-weight="800" text-anchor="end">+ H₂O</text>
        
      <g transform="translate(18, 12)">
        <text x="0" y="0" fill="#0f172a" font-size="12" font-weight="800">6-Fosfogluconolactonasa</text>
        <text x="0" y="13" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">EC 3.1.1.31 (Mg²⁺)</text>
        
      </g>
    </g>
    

      <!-- Metabolito: 6-Fosfogluconato -->
      <g transform="translate(340, 475)">
        <g transform="translate(0, 0)">
          
  <!-- C1: Grupo Carboxilato COO- arriba -->
  <text x="40" y="14" fill="#0f172a" font-size="12" font-weight="900" text-anchor="middle">COO⁻</text>
  <line x1="40" y1="18" x2="40" y2="30" stroke="#0f172a" stroke-width="2.2"/>

  <!-- C2: H-C-OH -->
  <text x="40" y="40" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">H-C-OH</text>
  <line x1="40" y1="44" x2="40" y2="52" stroke="#0f172a" stroke-width="2.2"/>

  <!-- C3: HO-C-H -->
  <text x="40" y="62" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">HO-C-H</text>
  <line x1="40" y1="66" x2="40" y2="74" stroke="#0f172a" stroke-width="2.2"/>

  <!-- C4 y C5: (CHOH)2 -->
  <text x="40" y="84" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">(CHOH)₂</text>
  <line x1="40" y1="88" x2="40" y2="96" stroke="#0f172a" stroke-width="2.2"/>

  <!-- C6: CH2-O-P con grupo fosfato -->
  <text x="40" y="106" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">CH₂-O</text>
  <circle cx="40" cy="126" r="13" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="40" y="130" fill="#c2410c" font-size="11" font-weight="900" text-anchor="middle">Ⓟ</text>

        </g>
        <g transform="translate(135, 25)">
          <text x="0" y="0" fill="#0f172a" font-size="17" font-weight="800" >6-Fosfogluconato</text>
          <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" >6 Carbonos (Cadena lineal)</text>
          <text x="0" y="34" fill="#64748b" font-size="11" >Ácido carboxílico fosforilado</text>
        </g>
      </g>
    

    <!-- Reacción: 6-Fosfogluconato Deshidrogenasa -->
    <g transform="translate(385, 585)">
      <line x1="0" y1="0" x2="0" y2="58" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrowFlow)"/>
      
        <!-- Entrada de NADP+ -->
        <path d="M -75 8 Q -25 8 -4 18" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
        <text x="-80" y="11" fill="#475569" font-size="11" font-weight="800" text-anchor="end">NADP⁺</text>
        <!-- Salida de NADPH + H+ -->
        <path d="M -4 24 Q -25 34 -75 34" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowNADPH)"/>
        <text x="-80" y="37" fill="#059669" font-size="11" font-weight="800" text-anchor="end">+ NADPH + H⁺</text>
        
        <!-- Desprendimiento de CO2 -->
        <path d="M -4 38 Q -30 52 -75 52" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
        <text x="-80" y="55" fill="#475569" font-size="11" font-weight="800" text-anchor="end">+ CO₂ ↑</text>
        
      <g transform="translate(18, 12)">
        <text x="0" y="0" fill="#0f172a" font-size="12" font-weight="800">6-Fosfogluconato Deshidrogenasa</text>
        <text x="0" y="13" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">EC 1.1.1.44 (Descarboxilación Oxidativa)</text>
        
      </g>
    </g>
    

      <!-- Metabolito: D-Ribulosa-5-Fosfato -->
      <g transform="translate(340, 695)">
        <g transform="translate(0, 0)">
          
  <!-- C1: CH2OH arriba -->
  <text x="40" y="14" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">CH₂OH</text>
  <line x1="40" y1="18" x2="40" y2="32" stroke="#0f172a" stroke-width="2.2"/>

  <!-- C2: C=O (Grupo carbonilo cetona) -->
  <text x="40" y="44" fill="#0f172a" font-size="12" font-weight="800" text-anchor="middle">C</text>
  <line x1="47" y1="39" x2="65" y2="39" stroke="#0f172a" stroke-width="2"/>
  <line x1="47" y1="43" x2="65" y2="43" stroke="#0f172a" stroke-width="2"/>
  <text x="73" y="45" fill="#dc2626" font-size="13" font-weight="900">O</text>

  <!-- Enlace C2 a C3 -->
  <line x1="40" y1="49" x2="40" y2="60" stroke="#0f172a" stroke-width="2.2"/>
  <!-- C3 y C4: (CHOH)2 -->
  <text x="40" y="70" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">(CHOH)₂</text>

  <!-- C5: CH2-O-P -->
  <line x1="40" y1="75" x2="40" y2="86" stroke="#0f172a" stroke-width="2.2"/>
  <text x="40" y="96" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">CH₂-O</text>
  <circle cx="40" cy="116" r="13" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="40" y="120" fill="#c2410c" font-size="11" font-weight="900" text-anchor="middle">Ⓟ</text>

        </g>
        <g transform="translate(135, 25)">
          <text x="0" y="0" fill="#0f172a" font-size="17" font-weight="800" >D-Ribulosa-5-Fosfato</text>
          <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" >5 Carbonos (Pentosa Cetosa)</text>
          <text x="0" y="34" fill="#64748b" font-size="11" >Punto de ramificación de la fase no oxidativa</text>
        </g>
      </g>
    

    <!-- Ramificación dual de la Ribulosa-5-P -->
    <g transform="translate(385, 805)">
      <!-- Rama Izquierda (Epimerasa -> Xilulosa-5-P) -->
      <path d="M -15 0 Q -100 25 -160 65" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowFlow)"/>
      <g transform="translate(-150, 20)">
        <text x="0" y="0" fill="#0f172a" font-size="11" font-weight="800">Fosfopentosa Epimerasa</text>
        <text x="0" y="13" fill="#64748b" font-size="9" font-family="'JetBrains Mono', monospace">EC 5.1.3.1 (⇄)</text>
      </g>

      <!-- Rama Derecha (Isomerasa -> Ribosa-5-P) -->
      <path d="M 15 0 Q 100 25 180 65" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowFlow)"/>
      <g transform="translate(130, 20)">
        <text x="0" y="0" fill="#0f172a" font-size="11" font-weight="800">Fosfopentosa Isomerasa</text>
        <text x="0" y="13" fill="#64748b" font-size="9" font-family="'JetBrains Mono', monospace">EC 5.3.1.6 (⇄)</text>
      </g>
    </g>
    

      <!-- Metabolito: D-Xilulosa-5-P -->
      <g transform="translate(70, 885)">
        <g transform="translate(150, 0)">
          
  <!-- C1: CH2OH arriba -->
  <text x="40" y="14" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">HO-CH₂</text>
  <line x1="40" y1="18" x2="40" y2="32" stroke="#0f172a" stroke-width="2.2"/>

  <!-- C2: C=O -->
  <text x="40" y="44" fill="#0f172a" font-size="12" font-weight="800" text-anchor="middle">C</text>
  <line x1="47" y1="39" x2="65" y2="39" stroke="#0f172a" stroke-width="2"/>
  <line x1="47" y1="43" x2="65" y2="43" stroke="#0f172a" stroke-width="2"/>
  <text x="73" y="45" fill="#dc2626" font-size="13" font-weight="900">O</text>

  <!-- Enlace C2 a C3 (Inversión epimérica de -OH) -->
  <line x1="40" y1="49" x2="40" y2="60" stroke="#0f172a" stroke-width="2.2"/>
  <text x="40" y="70" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">HO-C-H</text>

  <!-- C4 y C5: CHOH - CH2O-P -->
  <line x1="40" y1="75" x2="40" y2="86" stroke="#0f172a" stroke-width="2.2"/>
  <text x="40" y="96" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">H-C-OH</text>
  <circle cx="40" cy="116" r="13" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="40" y="120" fill="#c2410c" font-size="11" font-weight="900" text-anchor="middle">Ⓟ</text>

        </g>
        <g transform="translate(130, 25)">
          <text x="0" y="0" fill="#0f172a" font-size="17" font-weight="800" text-anchor="end">D-Xilulosa-5-P</text>
          <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" text-anchor="end">5 Carbonos (Epímero C3)</text>
          <text x="0" y="34" fill="#64748b" font-size="11" text-anchor="end">Donador de 2C en Transcetolasa</text>
        </g>
      </g>
    

      <!-- Metabolito: D-Ribosa-5-Fosfato -->
      <g transform="translate(560, 885)">
        <g transform="translate(0, 0)">
          
  <!-- Anillo furanosa de 5 lados (Pentosa aldosa cíclica) -->
  <polygon points="35,18 68,38 52,68 18,68 2,38" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Oxígeno superior del anillo -->
  <circle cx="35" cy="18" r="7" fill="#ffffff"/>
  <text x="35" y="22" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">O</text>

  <!-- C1 (derecha): OH anomérico -->
  <line x1="68" y1="38" x2="84" y2="38" stroke="#0f172a" stroke-width="2"/>
  <text x="94" y="42" fill="#0f172a" font-size="10" font-weight="700">OH</text>

  <!-- C5 (izquierda): Grupo Fosfato -->
  <line x1="2" y1="38" x2="-10" y2="18" stroke="#0f172a" stroke-width="2.2"/>
  <circle cx="-16" cy="6" r="13" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="-16" y="10" fill="#c2410c" font-size="11" font-weight="900" text-anchor="middle">Ⓟ</text>

  <!-- C2 y C3 con grupos -OH abajo -->
  <line x1="52" y1="68" x2="52" y2="80" stroke="#0f172a" stroke-width="2"/>
  <text x="52" y="90" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">OH</text>

  <line x1="18" y1="68" x2="18" y2="80" stroke="#0f172a" stroke-width="2"/>
  <text x="18" y="90" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">HO</text>

        </g>
        <g transform="translate(135, 25)">
          <text x="0" y="0" fill="#0f172a" font-size="17" font-weight="800" >D-Ribosa-5-Fosfato</text>
          <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" >5 Carbonos (Pentosa Aldosa)</text>
          <text x="0" y="34" fill="#64748b" font-size="11" >Precursora de Nucleótidos</text>
        </g>
      </g>
    

    <!-- Salida hacia Síntesis de Nucleótidos -->
    <g transform="translate(730, 990)">
      <path d="M 0 0 L 0 50" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
      <rect x="-80" y="55" width="160" height="34" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
      <text x="0" y="70" fill="#6d28d9" font-size="11" font-weight="800" text-anchor="middle">SÍNTESIS DE NUCLEÓTIDOS</text>
      <text x="0" y="83" fill="#7c3aed" font-size="9" font-weight="600" text-anchor="middle">ATP • GTP • ARN • ADN • PRPP</text>
    </g>
    

    <!-- Interconversión No Oxidativa (Transcetolasa y Transaldolasa) -->
    <g transform="translate(230, 1020)">
      <rect x="-10" y="0" width="360" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="170" y="24" fill="#0f172a" font-size="12" font-weight="800" text-anchor="middle">Transcetolasa (TPP) + Transaldolasa</text>
      <text x="170" y="42" fill="#64748b" font-size="10" text-anchor="middle">Barajado de C5 + C5 ⇄ C3 + C7 ⇄ C6 + C4</text>
      
      <!-- Flechas de retorno a Glucólisis -->
