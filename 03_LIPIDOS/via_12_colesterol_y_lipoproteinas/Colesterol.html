<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Síntesis de Colesterol (Vía del Mevalonato) en Entorno Biológico Real</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #e2e8f0;
      color: #0f172a;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lienzo-svg {
      width: 1000px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="lienzo-svg">
    <svg width="1000" height="2300" viewBox="0 0 1000 2300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Flecha de flujo metabólico principal (Ámbar / Naranja) -->
        <marker id="arrowFlow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M 0 0 L 6 3 L 0 6 Z" fill="#ea580c" />
        </marker>
        <!-- Flecha de gasto de energía / reactivo (Roja) -->
        <marker id="arrowRed" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#dc2626" />
        </marker>
        <!-- Flecha de subproducto / cofactor gastado (Gris pizarra) -->
        <marker id="arrowSlate" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#475569" />
        </marker>
        <!-- Flecha de ganancia / poder reductor (Verde esmeralda) -->
        <marker id="arrowGreen" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#059669" />
        </marker>
        <!-- Flecha de agua (Azul) -->
        <marker id="arrowBlue" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#0284c7" />
        </marker>
        <!-- Flecha de Coenzima A (Púrpura) -->
        <marker id="arrowPurple" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#7c3aed" />
        </marker>
        <!-- Flecha de NADPH / Reducción (Verde azulado) -->
        <marker id="arrowTeal" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#0d9488" />
        </marker>

        
    <!-- Gradiente del Citosol Celular -->
    <linearGradient id="colestGradCitosol" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="1" />
      <stop offset="100%" stop-color="#fefce8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Gradiente de la Membrana del Retículo Endoplásmico Liso (REL) -->
    <linearGradient id="colestGradREL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#ffedd5" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.95" />
    </linearGradient>

    <!-- Gradiente de la Enzima HMG-CoA Reductasa Anclada -->
    <linearGradient id="colestGradHMGCR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Gradiente de Gota Lipídica de Ésteres de Colesterol -->
    <radialGradient id="colestGradGotaCol" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#eab308" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.9" />
    </radialGradient>

      </defs>
<rect x="0" y="0" width="1000" height="2300" fill="url(#colestGradCitosol)" />

    <g opacity="0.32" stroke="#94a3b8" fill="none">
      <path d="M 30 200 Q 300 170 600 220 T 970 190" stroke-width="1.5" stroke-dasharray="8 6"/>
      <path d="M 50 400 Q 350 440 650 380 T 950 420" stroke-width="1.4" stroke-dasharray="6 5"/>
      <path d="M 40 850 Q 280 810 580 870 T 960 830" stroke-width="1.5" stroke-dasharray="8 6"/>
      <path d="M 60 1350 Q 380 1390 700 1330 T 940 1370" stroke-width="1.4" stroke-dasharray="7 5"/>
      <path d="M 30 1850 Q 300 1810 620 1870 T 970 1840" stroke-width="1.5" stroke-dasharray="8 6"/>
    </g>

    <!-- Polirribosomas citosólicos -->
    <g fill="#94a3b8" opacity="0.25">
      <circle cx="80" cy="180" r="2.5"/><circle cx="86" cy="182" r="2"/><circle cx="84" cy="188" r="2.3"/>
      <circle cx="910" cy="300" r="2.5"/><circle cx="916" cy="302" r="2"/><circle cx="914" cy="308" r="2.3"/>
      <circle cx="100" cy="980" r="2.5"/><circle cx="106" cy="982" r="2"/>
      <circle cx="890" cy="1550" r="2.5"/><circle cx="896" cy="1552" r="2"/>
    </g>
    

    <text x="35" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#1e3a8a" letter-spacing="1.5">
      CITOPLASMA CELULAR (CITOSOL) • FASE TEMPRANA Y CONDENSACIÓN DE ACETIL-CoA
    </text>
    

    <!-- Membrana del REL donde se ancla la HMG-CoA Reductasa y enzimas de ciclación -->
    <g id="membrana_rel">
      <path d="M 0 510 Q 333.3333333333333 495, 500.0 510 T 1000 510" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
      <path d="M 0 560 Q 333.3333333333333 545, 500.0 560 T 1000 560" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
      <path d="M 0 512 Q 333.3333333333333 497, 500.0 512 T 1000 512 L 1000 558 Q 666.6666666666666 547, 500.0 558 T 0 558 Z" fill="url(#colestGradREL)" opacity="0.6"/>
      
      <text x="965" y="582" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#c2410c" text-anchor="end">
        MEMBRANA DEL RETÍCULO ENDOPLÁSMICO LISO (REL) • ANCLAJE DE HMGCR &amp; CICLASAS
      </text>
    </g>
    

    <!-- Gota lipídica de reserva de Ésteres de Colesterol (CE) -->
    <g transform="translate(130, 2180)" opacity="0.95">
      <circle cx="0" cy="0" r="48" fill="url(#colestGradGotaCol)" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="6 3"/>
      <text x="0" y="-8" fill="#78350f" font-size="9.5" font-weight="900" font-family="'Inter', sans-serif" text-anchor="middle">GOTA LIPÍDICA</text>
      <text x="0" y="6" fill="#854d0e" font-size="8" font-weight="800" font-family="'JetBrains Mono', monospace" text-anchor="middle">ÉSTERES DE COLESTEROL</text>
      <text x="0" y="20" fill="#a16207" font-size="8" font-weight="700" font-family="'Inter', sans-serif" text-anchor="middle">Almacenamiento (ACAT)</text>
    </g>
    

    <g transform="translate(80, 80)">
      <rect x="0" y="0" width="310" height="38" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
      <text x="15" y="18" fill="#9a3412" font-size="11.5" font-weight="900" font-family="'Inter', sans-serif">2 Acetil-CoA (de ATP Citrato Liasa / Citosol)</text>
      <text x="15" y="30" fill="#c2410c" font-size="9.5" font-weight="700" font-family="'JetBrains Mono', monospace">Pool citosólico compartido con Lipogénesis</text>
    </g>
    <path d="M 390 99 L 385 99 L 385 130" fill="none" stroke="#ea580c" stroke-width="2.6" marker-end="url(#arrowFlow)"/>
    

    <!-- Reacción: Tiolasa Citosólica (ACAT2 / Acetil-CoA Acetiltransferasa) -->
    <g id="rx_tiolasa_colest" data-arrastrable="1" transform="translate(385, 130)">
      <!-- Flecha central de flujo -->
      <line x1="0" y1="0" x2="0" y2="55" stroke="#ea580c" stroke-width="2.6" marker-end="url(#arrowFlow)"/>
      
      <!-- Acoplamiento de reactivos y energía -->
      
        <path d="M -85 10 Q -30 10 -4 20" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
        <text x="-90" y="13" fill="#dc2626" font-size="11" font-weight="800" font-family="'Inter', sans-serif" text-anchor="end">+ Acetil-CoA</text>
        
        <path d="M -4 26 Q -30 36 -85 36" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
        <text x="-90" y="39" fill="#475569" font-size="11" font-weight="800" font-family="'Inter', sans-serif" text-anchor="end">- CoA-SH</text>
        
      
      <!-- Textos informativos de la enzima a la derecha -->
      <g transform="translate(18, 14)">
        
        <text x="0" y="0" fill="#0f172a" font-size="12.5" font-weight="800" font-family="'Inter', sans-serif">Tiolasa Citosólica (ACAT2 / Acetil-CoA Acetiltransferasa)</text>
        <text x="0" y="14" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">EC 2.3.1.9 • Reversible</text>
        <text x="0" y="27" fill="#059669" font-size="10" font-weight="800" font-family="'Inter', sans-serif">Condensación de 2 Acetil-CoA</text>
      </g>
    </g>
    

    <!-- Metabolito: Acetoacetil-CoA -->
    <g id="m_acetoacetil_coa_col" data-arrastrable="1" transform="translate(240, 215)">
      <g transform="translate(0, 0)">
        
<g class="mol-acetoacetil-coa" stroke="#0f172a" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cápsula CoA-S a la izquierda -->
  <rect x="2" y="17" width="46" height="22" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="25" y="32" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" fill="#6d28d9" stroke="none" text-anchor="middle">CoA-S</text>
  <line x1="48" y1="28" x2="70" y2="28" stroke="#7c3aed" stroke-width="2.3"/>

  <!-- C1 Carbonilo tioéster -->
  <line x1="67" y1="28" x2="67" y2="12" stroke="#dc2626" stroke-width="2.1"/>
  <line x1="73" y1="28" x2="73" y2="12" stroke="#dc2626" stroke-width="2.1"/>
  <text x="70" y="8" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#dc2626" stroke="none" text-anchor="middle">O</text>

  <!-- C2 metileno (alfa) -->
  <line x1="70" y1="28" x2="94" y2="44" />
  <circle cx="94" cy="44" r="3" fill="#ea580c" stroke="none"/>
  <text x="94" y="58" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ea580c" stroke="none" text-anchor="middle">CH₂</text>

  <!-- C3 Carbonilo beta (cetona) -->
  <line x1="94" y1="44" x2="118" y2="28" />
  <line x1="115" y1="28" x2="115" y2="12" stroke="#dc2626" stroke-width="2.1"/>
  <line x1="121" y1="28" x2="121" y2="12" stroke="#dc2626" stroke-width="2.1"/>
  <text x="118" y="8" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#dc2626" stroke="none" text-anchor="middle">O</text>

  <!-- C4 metilo terminal -->
  <line x1="118" y1="28" x2="140" y2="42" />
  <text x="144" y="46" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" fill="#0f172a" stroke="none">CH₃</text>
</g>

      </g>
      <g transform="translate(210, 26)">
        <text x="0" y="0" fill="#0f172a" font-size="16.5" font-weight="800" font-family="'Inter', sans-serif" >Acetoacetil-CoA</text>
        <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace" >4 Carbonos (Condensación Citosólica)</text>
        <text x="0" y="34" fill="#64748b" font-size="11" font-family="'Inter', sans-serif" >Intermedio común de síntesis de colesterol en citosol</text>
      </g>
    </g>
    

    <!-- Reacción: HMG-CoA Sintasa Citosólica (HMGCS1) -->
    <g id="rx_hmg_sintasa_colest" data-arrastrable="1" transform="translate(385, 310)">
      <!-- Flecha central de flujo -->
      <line x1="0" y1="0" x2="0" y2="60" stroke="#ea580c" stroke-width="2.6" marker-end="url(#arrowFlow)"/>
      
      <!-- Acoplamiento de reactivos y energía -->
      
        <path d="M -85 10 Q -30 10 -4 20" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
        <text x="-90" y="13" fill="#dc2626" font-size="11" font-weight="800" font-family="'Inter', sans-serif" text-anchor="end">+ Acetil-CoA + H₂O</text>
        
        <path d="M -4 26 Q -30 36 -85 36" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
        <text x="-90" y="39" fill="#475569" font-size="11" font-weight="800" font-family="'Inter', sans-serif" text-anchor="end">- CoA-SH</text>
        
      
      <!-- Textos informativos de la enzima a la derecha -->
      <g transform="translate(18, 14)">
        
        <text x="0" y="0" fill="#0f172a" font-size="12.5" font-weight="800" font-family="'Inter', sans-serif">HMG-CoA Sintasa Citosólica (HMGCS1)</text>
        <text x="0" y="14" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">EC 2.3.3.10 • Isoforma citosólica (≠ mitocondrial)</text>
        <text x="0" y="27" fill="#059669" font-size="10" font-weight="800" font-family="'Inter', sans-serif">Incorpora el 3er Acetil-CoA con gasto de agua</text>
      </g>
    </g>
    

    <!-- Metabolito: HMG-CoA (3-Hidroxi-3-Metilglutaril-CoA) -->
    <g id="m_hmg_coa_cit" data-arrastrable="1" transform="translate(240, 400)">
      <g transform="translate(0, 0)">
        
<g class="mol-hmg-coa" stroke="#0f172a" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cápsula CoA-S a la izquierda -->
  <rect x="2" y="27" width="46" height="22" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="25" y="42" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" fill="#6d28d9" stroke="none" text-anchor="middle">CoA-S</text>
  <line x1="48" y1="38" x2="70" y2="38" stroke="#7c3aed" stroke-width="2.3"/>

  <!-- C1 Carbonilo tioéster -->
  <line x1="67" y1="38" x2="67" y2="22" stroke="#dc2626" stroke-width="2.1"/>
  <line x1="73" y1="38" x2="73" y2="22" stroke="#dc2626" stroke-width="2.1"/>
  <text x="70" y="18" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#dc2626" stroke="none" text-anchor="middle">O</text>

  <!-- C2 metileno -->
  <line x1="70" y1="38" x2="95" y2="38" />

  <!-- C3 central ramificado con OH y CH3 -->
  <line x1="95" y1="38" x2="120" y2="38" />
  <circle cx="120" cy="38" r="3.2" fill="#0f172a" stroke="none"/>
  <!-- C3 OH arriba -->
  <line x1="120" y1="38" x2="120" y2="18" stroke="#0284c7" stroke-width="2.2"/>
  <text x="120" y="13" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#0284c7" stroke="none" text-anchor="middle">OH</text>
  <!-- C3 CH3 ramificación abajo -->
  <line x1="120" y1="38" x2="120" y2="56" />
  <text x="120" y="69" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" fill="#0f172a" stroke="none" text-anchor="middle">CH₃</text>

  <!-- C4 metileno -->
  <line x1="120" y1="38" x2="145" y2="38" />

  <!-- C5 carboxilato terminal (COO⁻) -->
  <line x1="145" y1="38" x2="168" y2="24" />
  <text x="172" y="27" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#dc2626" stroke="none">COO⁻</text>
</g>

      </g>
      <g transform="translate(210, 26)">
        <text x="0" y="0" fill="#0f172a" font-size="16.5" font-weight="800" font-family="'Inter', sans-serif" >HMG-CoA (3-Hidroxi-3-Metilglutaril-CoA)</text>
        <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace" >6 Carbonos (Sustrato Clave del Marcapasos)</text>
        <text x="0" y="34" fill="#64748b" font-size="11" font-family="'Inter', sans-serif" >Listo para reducirse en la membrana del REL</text>
      </g>
    </g>
    

    <!-- Reacción: HMG-CoA Reductasa (HMGCR) • [PASO LIMITANTE] -->
    <g id="rx_hmg_reductasa" data-arrastrable="1" transform="translate(385, 500)">
      <!-- Flecha central de flujo -->
      <line x1="0" y1="0" x2="0" y2="65" stroke="#ea580c" stroke-width="2.6" marker-end="url(#arrowFlow)"/>
      
      <!-- Acoplamiento de reactivos y energía -->
      
        <path d="M -85 10 Q -30 10 -4 20" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrowTeal)"/>
        <text x="-90" y="13" fill="#0d9488" font-size="11" font-weight="800" font-family="'Inter', sans-serif" text-anchor="end">- 2 NADPH + 2 H⁺</text>
        
        <path d="M -4 26 Q -30 36 -85 36" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
        <text x="-90" y="39" fill="#475569" font-size="11" font-weight="800" font-family="'Inter', sans-serif" text-anchor="end">+ 2 NADP⁺ + CoA-SH</text>
        
      
      <!-- Textos informativos de la enzima a la derecha -->
      <g transform="translate(18, 14)">
        
        <rect x="-10" y="-8" width="280" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.65"/>
        
        <text x="0" y="0" fill="#0f172a" font-size="12.5" font-weight="800" font-family="'Inter', sans-serif">HMG-CoA Reductasa (HMGCR) • [PASO LIMITANTE]</text>
        <text x="0" y="14" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">EC 1.1.1.34 • Anclada a la membrana del REL</text>
        <text x="0" y="27" fill="#dc2626" font-size="10" font-weight="800" font-family="'Inter', sans-serif">⊕ Insulina, SREBP-2 • ⊣ Glucagón, AMPK, Estatinas</text>
      </g>
    </g>
    

    <!-- Bloque de diana terapéutica: Estatinas -->
    <g id="diana_estatinas" transform="translate(685, 495)">
      <rect x="0" y="0" width="265" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
      <text x="12" y="18" fill="#991b1b" font-size="11.5" font-weight="900" font-family="'Inter', sans-serif">💊 DIANA CLÍNICA: ESTATINAS</text>
      <text x="12" y="32" fill="#b91c1c" font-size="9.5" font-family="'Inter', sans-serif">Atorvastatina, Rosuvastatina, Simvastatina</text>
      <text x="12" y="44" fill="#7f1d1d" font-size="9" font-weight="700" font-family="'Inter', sans-serif">Inhibición competitiva reversible de HMGCR</text>
      <!-- Flecha indicadora -->
      <path d="M 0 26 L -25 26" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
    </g>
    

    <!-- Metabolito: Mevalonato (Ácido Mevalónico) -->
    <g id="m_mevalonato" data-arrastrable="1" transform="translate(240, 605)">
      <g transform="translate(0, 0)">
        
<g class="mol-mevalonato" stroke="#0f172a" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- C1 Carboxilato terminal -->
  <text x="8" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#dc2626" stroke="none">⁻OOC</text>
  <line x1="46" y1="18" x2="72" y2="34" />

  <!-- C2 metileno -->
  <line x1="72" y1="34" x2="98" y2="34" />

  <!-- C3 central ramificado con OH y CH3 -->
  <circle cx="98" cy="34" r="3.2" fill="#0f172a" stroke="none"/>
  <!-- C3 OH arriba -->
  <line x1="98" y1="34" x2="98" y2="14" stroke="#0284c7" stroke-width="2.2"/>
  <text x="98" y="9" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#0284c7" stroke="none" text-anchor="middle">OH</text>
  <!-- C3 CH3 abajo -->
  <line x1="98" y1="34" x2="98" y2="52" />
  <text x="98" y="65" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" fill="#0f172a" stroke="none" text-anchor="middle">CH₃</text>

  <!-- C4 metileno -->
  <line x1="98" y1="34" x2="124" y2="34" />

  <!-- C5 alcohol primario terminal (CH2-CH2-OH reducido de tioéster) -->
  <line x1="124" y1="34" x2="148" y2="20" />
  <text x="152" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#0284c7" stroke="none">CH₂OH</text>
</g>

      </g>
      <g transform="translate(210, 26)">
        <text x="0" y="0" fill="#0f172a" font-size="16.5" font-weight="800" font-family="'Inter', sans-serif" >Mevalonato (Ácido Mevalónico)</text>
        <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace" >6 Carbonos (Paso Irreversible Cumplido)</text>
        <text x="0" y="34" fill="#64748b" font-size="11" font-family="'Inter', sans-serif" >Comprometido irrevocablemente a la síntesis de isoprenoides</text>
