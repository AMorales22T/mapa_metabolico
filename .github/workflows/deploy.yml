name: Desplegar Mapa Metabólico en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos requeridos para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un despliegue concurrente a la vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar archivos del sitio web
        run: |
          mkdir -p _site
          # 1. Copiar todos los entregables HTML y SVG
          cp -r versiones_html/* _site/
          # 2. Portada directa: El mapa metabólico interactivo completo de 25 vías
          cp versiones_html/01_mapa_ampliado_completo_25_vias.html _site/index.html
          # 3. Copiar PDFs tanto en _site/versiones_impresion/ como en la raíz para compatibilidad absoluta
          mkdir -p _site/versiones_impresion
          cp -r versiones_impresion/* _site/versiones_impresion/
          cp -r versiones_impresion/* _site/
          # 3. Copiar capturas y vistas previas
          mkdir -p _site/capturas_y_pruebas
          cp -r capturas_y_pruebas/* _site/capturas_y_pruebas/
          # 4. Asegurar vista previa ampliada disponible
          cp 07_AMPLIACION_TEMARIO/mapa_cartulina_ampliado_preview.png _site/ || true

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
