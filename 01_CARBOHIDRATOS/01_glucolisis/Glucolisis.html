<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vía Glucolítica - Mapa Metabólico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lienzo-svg {
      width: 1000px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.07);
      overflow: hidden;
    }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="lienzo-svg">
    <svg width="1000" height="2150" viewBox="0 0 1000 2150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Flecha de flujo metabólico principal (Naranja) -->
        <marker id="arrowFlow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M 0 0 L 6 3 L 0 6 Z" fill="#ea580c" />
        </marker>
        <!-- Flecha de gasto de energía (Roja) -->
        <marker id="arrowRed" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#dc2626" />
        </marker>
        <!-- Flecha de salida de producto energético (Gris pizarra) -->
        <marker id="arrowSlate" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#475569" />
        </marker>
        <!-- Flecha de generación de energía / ganancia (Verde esmeralda) -->
        <marker id="arrowGreen" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#059669" />
        </marker>
        <!-- Flecha de salida de agua (Azul) -->
        <marker id="arrowBlue" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#0284c7" />
        </marker>
      </defs>

      <!-- Metabolito: D-Glucosa -->
      <g transform="translate(340, 70)">
        <g transform="translate(0, 0)">
          
  <!-- Anillo de 6 lados -->
  <polygon points="50,22 72,36 50,58 16,58 0,36 16,22" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Oxígeno del anillo -->
  <circle cx="16" cy="22" r="7" fill="#ffffff"/>
  <text x="16" y="26" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">O</text>

  <!-- Carbono 6: -CH2OH arriba -->
  <line x1="0" y1="36" x2="0" y2="12" stroke="#0f172a" stroke-width="2.2"/>
  <text x="0" y="7" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">CH₂OH</text>

  <!-- Grupos hidroxilo (-OH) -->
  <!-- C1 (derecha) -->
  <line x1="72" y1="36" x2="88" y2="36" stroke="#0f172a" stroke-width="2"/>
  <text x="98" y="40" fill="#0f172a" font-size="11" font-weight="700">OH</text>

  <!-- C2 (abajo derecha) -->
  <line x1="50" y1="58" x2="50" y2="72" stroke="#0f172a" stroke-width="2"/>
  <text x="50" y="83" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">OH</text>

  <!-- C3 (abajo izquierda) -->
  <line x1="16" y1="58" x2="16" y2="72" stroke="#0f172a" stroke-width="2"/>
  <text x="16" y="83" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">HO</text>

  <!-- C4 (izquierda) -->
  <line x1="0" y1="36" x2="-14" y2="36" stroke="#0f172a" stroke-width="2"/>
  <text x="-24" y="40" fill="#0f172a" font-size="11" font-weight="700">HO</text>

        </g>
        <g transform="translate(135, 25)">
          <text x="0" y="0" fill="#0f172a" font-size="17" font-weight="800" >D-Glucosa</text>
          <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" >6 Carbonos (Hexosa)</text>
          <text x="0" y="34" fill="#64748b" font-size="11" >Sustrato inicial de la glucólisis</text>
        </g>
      </g>
    

    <!-- Reacción: Hexoquinasa -->
    <g transform="translate(385, 185)">
      
        <line x1="0" y1="0" x2="0" y2="48" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrowFlow)"/>
        
      
        <path d="M -75 8 Q -25 8 -4 18" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
        <text x="-80" y="11" fill="#dc2626" font-size="11" font-weight="800" text-anchor="end">- 1 ATP</text>
        
        <path d="M -4 24 Q -25 34 -75 34" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
        <text x="-80" y="37" fill="#475569" font-size="11" font-weight="800" text-anchor="end">+ 1 ADP</text>
        
      <g transform="translate(18, 12)">
        <text x="0" y="0" fill="#0f172a" font-size="12" font-weight="800">Hexoquinasa</text>
        <text x="0" y="13" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">EC 2.7.1.1 (Mg²⁺)</text>
        <text x="0" y="26" fill="#e11d48" font-size="10" font-weight="700">⊣ Inhibida por G-6-P</text>
      </g>
    </g>
    

      <!-- Metabolito: Glucosa-6-Fosfato -->
      <g transform="translate(340, 270)">
        <g transform="translate(0, 0)">
          
  <!-- Anillo de 6 lados -->
  <polygon points="50,22 72,36 50,58 16,58 0,36 16,22" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Oxígeno del anillo -->
  <circle cx="16" cy="22" r="7" fill="#ffffff"/>
  <text x="16" y="26" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">O</text>

  <!-- Carbono 6 con Grupo Fosfato nítido y despejado -->
  <line x1="0" y1="36" x2="0" y2="12" stroke="#0f172a" stroke-width="2.2"/>
  <circle cx="0" cy="-2" r="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="0" y="3" fill="#c2410c" font-size="12" font-weight="900" text-anchor="middle">Ⓟ</text>
  <text x="-20" y="2" fill="#ea580c" font-size="9" font-weight="700" text-anchor="end">O-PO₃²⁻</text>

  <!-- Grupos hidroxilo (-OH) -->
  <line x1="72" y1="36" x2="88" y2="36" stroke="#0f172a" stroke-width="2"/>
  <text x="98" y="40" fill="#0f172a" font-size="11" font-weight="700">OH</text>

  <line x1="50" y1="58" x2="50" y2="72" stroke="#0f172a" stroke-width="2"/>
  <text x="50" y="83" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">OH</text>

  <line x1="16" y1="58" x2="16" y2="72" stroke="#0f172a" stroke-width="2"/>
  <text x="16" y="83" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">HO</text>

  <line x1="0" y1="36" x2="-14" y2="36" stroke="#0f172a" stroke-width="2"/>
  <text x="-24" y="40" fill="#0f172a" font-size="11" font-weight="700">HO</text>

        </g>
        <g transform="translate(135, 25)">
          <text x="0" y="0" fill="#0f172a" font-size="17" font-weight="800" >Glucosa-6-Fosfato</text>
          <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" >6 Carbonos (Fosforilada)</text>
          <text x="0" y="34" fill="#64748b" font-size="11" >Encrucijada: Vía Pentosas / Glucógeno</text>
        </g>
      </g>
    

    <!-- Reacción: Fosfohexosa Isomerasa -->
    <g transform="translate(385, 375)">
      
        <line x1="-3" y1="0" x2="-3" y2="48" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrowFlow)"/>
        <line x1="3" y1="48" x2="3" y2="0" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrowFlow)"/>
        
      
      <g transform="translate(18, 12)">
        <text x="0" y="0" fill="#0f172a" font-size="12" font-weight="800">Fosfohexosa Isomerasa</text>
        <text x="0" y="13" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">EC 5.3.1.9 (Mg²⁺)</text>
        
      </g>
    </g>
    

      <!-- Metabolito: Fructosa-6-Fosfato -->
      <g transform="translate(340, 460)">
        <g transform="translate(0, 0)">
          
  <!-- Anillo de furanosa (pentágono) -->
  <polygon points="35,18 68,38 52,68 18,68 2,38" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Oxígeno en el vértice superior del pentágono -->
  <circle cx="35" cy="18" r="7" fill="#ffffff"/>
  <text x="35" y="22" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">O</text>

  <!-- C1 (a la derecha): -CH2OH libre -->
  <line x1="68" y1="38" x2="88" y2="24" stroke="#0f172a" stroke-width="2.2"/>
  <text x="94" y="22" fill="#0f172a" font-size="10" font-weight="800">CH₂OH</text>
  <line x1="68" y1="38" x2="82" y2="50" stroke="#0f172a" stroke-width="2"/>
  <text x="88" y="55" fill="#0f172a" font-size="10" font-weight="700">OH</text>

  <!-- C6 (a la izquierda): Grupo Fosfato -->
  <line x1="2" y1="38" x2="-10" y2="18" stroke="#0f172a" stroke-width="2.2"/>
  <circle cx="-16" cy="6" r="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="-16" y="11" fill="#c2410c" font-size="12" font-weight="900" text-anchor="middle">Ⓟ</text>
  <text x="-35" y="10" fill="#ea580c" font-size="9" font-weight="700" text-anchor="end">O-PO₃²⁻</text>

  <!-- C3 y C4 con -OH abajo -->
  <line x1="52" y1="68" x2="52" y2="82" stroke="#0f172a" stroke-width="2"/>
  <text x="52" y="92" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">OH</text>

  <line x1="18" y1="68" x2="18" y2="82" stroke="#0f172a" stroke-width="2"/>
  <text x="18" y="92" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">HO</text>

        </g>
        <g transform="translate(135, 25)">
          <text x="0" y="0" fill="#0f172a" font-size="17" font-weight="800" >Fructosa-6-Fosfato</text>
          <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" >6 Carbonos (Furanosa)</text>
          <text x="0" y="34" fill="#64748b" font-size="11" >Isomerización aldosa → cetosa</text>
        </g>
      </g>
    

    <!-- Reacción: Fosfofructoquinasa-1 (PFK-1) -->
    <g transform="translate(385, 565)">
      
        <line x1="0" y1="0" x2="0" y2="48" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrowFlow)"/>
        
      
        <path d="M -75 8 Q -25 8 -4 18" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
        <text x="-80" y="11" fill="#dc2626" font-size="11" font-weight="800" text-anchor="end">- 1 ATP</text>
        
        <path d="M -4 24 Q -25 34 -75 34" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
        <text x="-80" y="37" fill="#475569" font-size="11" font-weight="800" text-anchor="end">+ 1 ADP</text>
        
      <g transform="translate(18, 12)">
        <text x="0" y="0" fill="#0f172a" font-size="12" font-weight="800">Fosfofructoquinasa-1 (PFK-1)</text>
        <text x="0" y="13" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">EC 2.7.1.11 (Mg²⁺)</text>
        <text x="0" y="26" fill="#e11d48" font-size="10" font-weight="700">⊕ AMP, F-2,6-BP | ⊣ ATP, Citrato</text>
      </g>
    </g>
    

      <!-- Metabolito: Fructosa-1,6-Bisfosfato -->
      <g transform="translate(340, 655)">
        <g transform="translate(0, 0)">
          
  <!-- Anillo de furanosa (pentágono) -->
  <polygon points="35,18 68,38 52,68 18,68 2,38" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Oxígeno superior -->
  <circle cx="35" cy="18" r="7" fill="#ffffff"/>
  <text x="35" y="22" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">O</text>

  <!-- C1 (a la derecha): Fosfato en C1 -->
  <line x1="68" y1="38" x2="88" y2="24" stroke="#0f172a" stroke-width="2.2"/>
  <circle cx="98" cy="14" r="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="98" y="19" fill="#c2410c" font-size="12" font-weight="900" text-anchor="middle">Ⓟ</text>

  <!-- C6 (a la izquierda): Fosfato en C6 -->
  <line x1="2" y1="38" x2="-10" y2="18" stroke="#0f172a" stroke-width="2.2"/>
  <circle cx="-16" cy="6" r="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="-16" y="11" fill="#c2410c" font-size="12" font-weight="900" text-anchor="middle">Ⓟ</text>

  <!-- C3 y C4 con -OH -->
  <line x1="52" y1="68" x2="52" y2="82" stroke="#0f172a" stroke-width="2"/>
  <text x="52" y="92" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">OH</text>

  <line x1="18" y1="68" x2="18" y2="82" stroke="#0f172a" stroke-width="2"/>
  <text x="18" y="92" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">HO</text>

        </g>
        <g transform="translate(135, 25)">
          <text x="0" y="0" fill="#0f172a" font-size="17" font-weight="800" >Fructosa-1,6-Bisfosfato</text>
          <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" >6 Carbonos (Doble fosfato)</text>
          <text x="0" y="34" fill="#64748b" font-size="11" >Molécula comprometida a la lisis</text>
        </g>
      </g>
    

    <!-- 1. Bifurcación Aldolasa (desde F-1,6-BP hacia DHAP y GAP) -->
    <g transform="translate(385, 765)">
      <!-- Flecha suave hacia DHAP (izquierda) -->
      <path d="M -15 0 Q -120 30 -160 70" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowFlow)"/>
      <!-- Flecha suave hacia GAP (derecha) -->
      <path d="M 15 0 Q 120 30 180 70" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowFlow)"/>
      
      <!-- Nombre de la Aldolasa en el centro despejado -->
      <g transform="translate(0, 26)">
        <text x="0" y="0" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">Aldolasa</text>
        <text x="0" y="14" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="middle">EC 4.1.2.13 (Reversible)</text>
      </g>
    </g>

    <!-- 2. Triosa Fosfato Isomerasa (TPI): Conexión horizontal libre entre DHAP y GAP -->
    <g transform="translate(420, 895)">
      <line x1="-120" y1="-3" x2="110" y2="-3" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrowFlow)"/>
      <line x1="110" y1="3" x2="-120" y2="3" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrowFlow)"/>
      <text x="-5" y="-12" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">Triosa Fosfato Isomerasa (TPI)</text>
      <text x="-5" y="18" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="middle">EC 5.3.1.1 (⇄)</text>
    </g>

    <!-- 3. Entrada fluida a la Fase 2 (Curva desde GAP hacia el eje central) -->
    <path d="M 600 965 Q 600 1000 385 1020" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrowFlow)"/>
    
    <!-- Badge elegante que anuncia la Fase 2 (sin elementos volando) -->
    <g transform="translate(385, 1005)">
      <rect x="-95" y="-12" width="190" height="24" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
      <text x="0" y="4" fill="#c2410c" font-size="11" font-weight="800" text-anchor="middle">FASE 2: RENDIMIENTO (× 2)</text>
    </g>
    

      <!-- Metabolito: Dihidroxiacetona-P -->
      <g transform="translate(70, 845)">
        <g transform="translate(150, 0)">
          
  <!-- C1: CH2OH arriba -->
  <text x="40" y="15" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">HO-CH₂</text>
  <line x1="40" y1="18" x2="40" y2="35" stroke="#0f172a" stroke-width="2.2"/>

  <!-- C2: C=O (Grupo carbonilo cetona) -->
  <text x="40" y="46" fill="#0f172a" font-size="12" font-weight="800" text-anchor="middle">C</text>
  <line x1="47" y1="41" x2="65" y2="41" stroke="#0f172a" stroke-width="2"/>
  <line x1="47" y1="45" x2="65" y2="45" stroke="#0f172a" stroke-width="2"/>
  <text x="73" y="47" fill="#dc2626" font-size="13" font-weight="800">O</text>

  <!-- C3: CH2-O-P hacia abajo -->
  <line x1="40" y1="52" x2="40" y2="68" stroke="#0f172a" stroke-width="2.2"/>
  <text x="40" y="78" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">CH₂-O</text>
  <line x1="40" y1="82" x2="40" y2="92" stroke="#0f172a" stroke-width="2"/>
  <circle cx="40" cy="104" r="13" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="40" y="108" fill="#c2410c" font-size="11" font-weight="900" text-anchor="middle">Ⓟ</text>

        </g>
        <g transform="translate(130, 25)">
          <text x="0" y="0" fill="#0f172a" font-size="17" font-weight="800" text-anchor="end">Dihidroxiacetona-P</text>
          <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" text-anchor="end">3 Carbonos (Cetosa)</text>
          <text x="0" y="34" fill="#64748b" font-size="11" text-anchor="end">Interconvertible hacia GAP</text>
        </g>
      </g>
    

      <!-- Metabolito: Gliceraldehído-3-P -->
      <g transform="translate(560, 845)">
        <g transform="translate(0, 0)">
          
  <!-- C1: Choque aldehído H-C=O -->
  <text x="40" y="15" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">HC=O</text>
  <text x="59" y="15" fill="#dc2626" font-size="12" font-weight="800"></text>
  <line x1="40" y1="20" x2="40" y2="38" stroke="#0f172a" stroke-width="2.2"/>

  <!-- C2: H-C-OH -->
  <text x="40" y="48" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">H-C-OH</text>
  <line x1="40" y1="53" x2="40" y2="70" stroke="#0f172a" stroke-width="2.2"/>

  <!-- C3: CH2-O-P -->
  <text x="40" y="80" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">CH₂-O</text>
  <line x1="40" y1="84" x2="40" y2="94" stroke="#0f172a" stroke-width="2"/>
  <circle cx="40" cy="106" r="13" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="40" y="110" fill="#c2410c" font-size="11" font-weight="900" text-anchor="middle">Ⓟ</text>

        </g>
        <g transform="translate(135, 25)">
          <text x="0" y="0" fill="#0f172a" font-size="17" font-weight="800" >Gliceraldehído-3-P</text>
          <text x="0" y="18" fill="#ea580c" font-size="12" font-weight="700" >3 Carbonos (Aldosa)</text>
          <text x="0" y="34" fill="#64748b" font-size="11" >Sustrato activo que continúa</text>
        </g>
      </g>
    

    <!-- Reacción: GAPDH (Gliceraldehído-3-P DH) -->
    <g transform="translate(385, 1045)">
      
        <line x1="-3" y1="0" x2="-3" y2="48" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrowFlow)"/>
        <line x1="3" y1="48" x2="3" y2="0" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrowFlow)"/>
        
      
        <path d="M -75 8 Q -25 8 -4 18" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
        <text x="-80" y="11" fill="#475569" font-size="11" font-weight="800" text-anchor="end">2 NAD⁺ + 2 Pi</text>
        
        <path d="M -4 24 Q -25 34 -75 34" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
        <text x="-80" y="37" fill="#059669" font-size="11" font-weight="800" text-anchor="end">+ 2 NADH + 2 H⁺</text>
        
      <g transform="translate(18, 12)">
        <text x="0" y="0" fill="#0f172a" font-size="12" font-weight="800">GAPDH (Gliceraldehído-3-P DH)</text>
        <text x="0" y="13" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">EC 1.2.1.12</text>
        
      </g>
    </g>
    

      <!-- Metabolito: 1,3-Bisfosfoglicerato -->
      <g transform="translate(340, 1140)">
        <g transform="translate(0, 0)">
          
  <!-- C1: Acil-fosfato P-O-C=O -->
