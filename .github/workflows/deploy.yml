name: Desplegar Mapa Metabólico en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos requeridos para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un despliegue concurrente a la vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar archivos del sitio web
        run: |
          mkdir -p _site
          # 1. Copiar todos los entregables HTML y SVG
          cp -r versiones_html/* _site/
          # 2. Copiar carpeta del mapa alternativo (SVG, HTML, PDF y preview PNG)
          mkdir -p _site/mapa_metabolico_alternativo
          cp -r mapa_metabolico_alternativo/* _site/mapa_metabolico_alternativo/
          # 3. Portada principal interactiva: index.html (Mapa Alternativo con Flujo Vivo 60 FPS y Selector Dual)
          cp index.html _site/index.html
          # 4. Asegurar que versiones_html/ exista tambien como subcarpeta para compatibilidad absoluta
          mkdir -p _site/versiones_html
          cp -r versiones_html/* _site/versiones_html/
          # 5. Copiar PDFs tanto en _site/versiones_impresion/ como en la raiz para compatibilidad absoluta
          mkdir -p _site/versiones_impresion
          cp -r versiones_impresion/* _site/versiones_impresion/
          cp -r versiones_impresion/* _site/
          # 6. Copiar capturas y vistas previas
          mkdir -p _site/capturas_y_pruebas
          cp -r capturas_y_pruebas/* _site/capturas_y_pruebas/
          # 7. Asegurar vista previa ampliada disponible
          cp 07_AMPLIACION_TEMARIO/mapa_cartulina_ampliado_preview.png _site/ || true
          # 8. Copiar repositorio de versiones historicas
          mkdir -p _site/versiones
          cp -rL versiones/* _site/versiones/ || true

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
