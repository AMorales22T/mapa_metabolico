<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaminación y Desaminación Oxidativa en Entorno Biológico Real</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #e2e8f0;
      color: #0f172a;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lienzo-svg {
      width: 1000px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="lienzo-svg">
    <svg width="1000" height="2200" viewBox="0 0 1000 2200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Flecha de flujo metabólico principal (Verde Azulado / Teal) -->
        <marker id="arrowFlow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M 0 0 L 6 3 L 0 6 Z" fill="#0d9488" />
        </marker>
        <!-- Flecha reversible / naranja secundaria -->
        <marker id="arrowOrange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M 0 0 L 6 3 L 0 6 Z" fill="#ea580c" />
        </marker>
        <!-- Flecha de gasto de energía (Roja) -->
        <marker id="arrowRed" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#dc2626" />
        </marker>
        <!-- Flecha de salida / subproducto (Gris pizarra) -->
        <marker id="arrowSlate" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#475569" />
        </marker>
        <!-- Flecha de ganancia / poder reductor (Verde esmeralda) -->
        <marker id="arrowGreen" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#059669" />
        </marker>
        <!-- Flecha de agua (Azul cian) -->
        <marker id="arrowBlue" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#0284c7" />
        </marker>

        
    <!-- Gradiente acuoso citosólico biológico -->
    <linearGradient id="gradCitosolAmino" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="1" />
      <stop offset="5%" stop-color="#f0fdfa" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="0.6" />
      <stop offset="90%" stop-color="#f0fdfa" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="1" />
    </linearGradient>

    <!-- Gradiente del medio extracelular vascular / intersticial (arriba) -->
    <linearGradient id="gradVascularAmino" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#991b1b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.75" />
    </linearGradient>

    <!-- Gradiente de la Matriz Mitocondrial (abajo, ámbar cálido) -->
    <radialGradient id="gradMitocondriaAmino" cx="50%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#fffbeb" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fef9c3" stop-opacity="0.85" />
    </radialGradient>

    <!-- Marcador de flecha verde azulada (Nitrógeno / Aminoácidos) -->
    <marker id="arrowTeal" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#0d9488" />
    </marker>
    <!-- Marcador de flecha azul (Grupos Amino / Nitrógeno) -->
    <marker id="arrowBlueAmino" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#2563eb" />
    </marker>

      </defs>

    <!-- ================================================================= -->
    <!-- CAPA 1: FONDO ACUOSO CITOSÓLICO                                   -->
    <!-- ================================================================= -->
    <rect x="0" y="0" width="1000" height="2200" fill="url(#gradCitosolAmino)" />

    <!-- ================================================================= -->
    <!-- CAPA 2: ESTRUCTURAS DEL CITOPLASMA (CITOESQUELETO Y VESÍCULAS)    -->
    <!-- ================================================================= -->
    <g opacity="0.32" stroke="#94a3b8" fill="none">
      <path d="M 40 220 Q 250 170 500 240 T 960 210" stroke-width="1.6" stroke-dasharray="8 6" />
      <path d="M 50 510 Q 320 580 620 530 T 950 550" stroke-width="1.5" stroke-dasharray="7 6" />
      <path d="M 40 850 Q 300 790 600 860 T 960 820" stroke-width="1.5" stroke-dasharray="8 5" />
      <path d="M 60 1180 Q 350 1240 680 1190 T 950 1220" stroke-width="1.4" stroke-dasharray="6 6" />
    </g>

    <!-- Polirribosomas celulares flotando en el citosol -->
    <g fill="#94a3b8" opacity="0.25">
      <circle cx="120" cy="180" r="2.5"/><circle cx="126" cy="182" r="2"/><circle cx="124" cy="188" r="2.3"/><circle cx="118" cy="187" r="2.1"/>
      <circle cx="860" cy="310" r="2.5"/><circle cx="867" cy="312" r="2"/><circle cx="864" cy="318" r="2.3"/><circle cx="858" cy="317" r="2.1"/>
      <circle cx="140" cy="740" r="2.5"/><circle cx="146" cy="743" r="2.2"/><circle cx="143" cy="748" r="2"/><circle cx="138" cy="746" r="2.3"/>
      <circle cx="880" cy="980" r="2.5"/><circle cx="887" cy="983" r="2"/><circle cx="883" cy="988" r="2.2"/><circle cx="877" cy="986" r="2.1"/>
    </g>

    <!-- Vesículas citosólicas translúcidas -->
    <g opacity="0.3">
      <circle cx="150" cy="420" r="24" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.8" stroke-dasharray="4 2"/>
      <circle cx="870" cy="650" r="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="4 2"/>
      <circle cx="160" cy="1050" r="26" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.8" stroke-dasharray="4 2"/>
    </g>

    <!-- ================================================================= -->
    <!-- CAPA 3: MEDIO EXTRACELULAR / TORRENTE SANGUÍNEO Y MEMBRANA PLASMÁTICA -->
    <!-- ================================================================= -->
    <path d="M 0 0 L 1000 0 L 1000 55 Q 500 78 0 55 Z" fill="url(#gradVascularAmino)" />
    
    <!-- Glóbulos rojos flotando en capilar superior -->
    <g opacity="0.85">
      <g transform="translate(180, 26) rotate(-10)">
        <ellipse cx="0" cy="0" rx="20" ry="12" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/>
        <ellipse cx="0" cy="0" rx="10" ry="5" fill="#7f1d1d" opacity="0.6"/>
      </g>
      <g transform="translate(820, 24) rotate(14)">
        <ellipse cx="0" cy="0" rx="22" ry="13" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/>
        <ellipse cx="0" cy="0" rx="11" ry="6" fill="#7f1d1d" opacity="0.6"/>
      </g>
    </g>

    <!-- Bicapa fosfolipídica plasmática -->
    <path d="M 0 55 Q 500 78 1000 55" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
    <path d="M 0 63 Q 500 86 1000 63" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Transportador de Aminoácidos en la membrana (LAT-1 / Sistema A) -->
    <g transform="translate(240, 42)">
      <path d="M 0 5 C 10 -10, 26 -10, 32 5 C 36 18, 32 36, 23 42 C 10 45, 2 35, 0 22 Z" fill="#0d9488" stroke="#0f766e" stroke-width="2"/>
      <path d="M 76 5 C 66 -10, 50 -10, 44 5 C 40 18, 44 36, 53 42 C 66 45, 74 35, 76 22 Z" fill="#0d9488" stroke="#0f766e" stroke-width="2"/>
      <ellipse cx="38" cy="20" rx="9" ry="17" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.6"/>
      <text x="38" y="47" fill="#0f766e" font-size="9.5" font-weight="900" font-family="'JetBrains Mono', monospace" text-anchor="middle">LAT-1 / ASCT2</text>
      <!-- Aminoácido entrando -->
      <line x1="38" y1="-18" x2="38" y2="8" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arrowTeal)"/>
      <line x1="38" y1="32" x2="38" y2="58" stroke="#0d9488" stroke-width="2.4" marker-end="url(#arrowTeal)"/>
    </g>
    <text x="340" y="32" fill="#fecaca" font-size="11" font-weight="800" font-family="'Inter', sans-serif">TORRENTE SANGUÍNEO • AMINOÁCIDOS DIETARIOS Y MUSCULARES</text>

    <!-- ================================================================= -->
    <!-- CAPA 4: MITOCONDRIA BIOLÓGICA REAL (ABAJO)                        -->
    <!-- ================================================================= -->
    <g transform="translate(0, 1520)">
      <!-- MME Membrana Mitocondrial Externa Lisa (Ámbar) -->
      <path d="M 0 50 Q 250 15 500 35 T 1000 25 L 1000 680 L 0 680 Z" fill="url(#gradMitocondriaAmino)" stroke="#b45309" stroke-width="3.5"/>
      
      <!-- Espacio Intermembrana (EIM) -->
      <path d="M 0 65 Q 250 30 500 50 T 1000 40" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="6 3"/>

      <!-- Crestas Mitocondriales Profundas -->
      <path d="M 60 130 C 130 80, 160 150, 230 100 C 280 150, 240 180, 130 170 Z" fill="#fef3c7" stroke="#b45309" stroke-width="2.5" opacity="0.85"/>
      <path d="M 720 120 C 790 70, 840 140, 910 90 C 970 140, 930 180, 800 165 Z" fill="#fef3c7" stroke="#b45309" stroke-width="2.5" opacity="0.85"/>

      <!-- Transportador Mitocondrial de Glutamato (Carrier AGC / GC) -->
      <g transform="translate(465, 20)">
        <rect x="0" y="0" width="70" height="28" rx="8" fill="#b45309" stroke="#78350f" stroke-width="2"/>
        <text x="35" y="18" fill="#ffffff" font-size="10.5" font-weight="900" font-family="'JetBrains Mono', monospace" text-anchor="middle">AGC / GC1</text>
      </g>
      <text x="550" y="38" fill="#78350f" font-size="11" font-weight="800" font-family="'Inter', sans-serif">Carrier de Glutamato / Aspartato (MMI)</text>

      <!-- Título biológico de la matriz (Despejado lateralmente) -->
      <g transform="translate(240, 75)">
        <text x="0" y="0" fill="#78350f" font-size="18" font-weight="900" font-family="'Inter', sans-serif" letter-spacing="3">MATRIZ MITOCONDRIAL</text>
        <text x="0" y="18" fill="#92400e" font-size="11.5" font-weight="700" font-family="'Inter', sans-serif">Desaminación Oxidativa • Destino Urea</text>
      </g>
    </g>
    
    <!-- Encabezado de la Sección 1 -->
    <g id="sec1_banner" data-arrastrable="1" transform="translate(500, 105)">
      <rect x="-240" y="-14" width="480" height="28" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/>
      <text x="0" y="4" fill="#0f766e" font-size="12" font-weight="900" font-family="'Inter', sans-serif" text-anchor="middle" letter-spacing="1">
        1. PRINCIPIO GENERAL DE LA TRANSAMINACIÓN (TRANSFERENCIA DE ⁺NH₃)
      </text>
    </g>
    
      <!-- Metabolito: L-Aminoácido -->
      <g id="m_aa_gen" data-arrastrable="1" transform="translate(70, 140)">
        <g transform="translate(0, 0)">
          
<g class="mol-aminoacido-gen" stroke="#0f172a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- C1: Carboxilato Superior -->
  <text x="40" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#dc2626" stroke="none" text-anchor="middle">COO⁻</text>
  <line x1="40" y1="22" x2="40" y2="40" />

  <!-- C2: C-alfa quiral -->
  <circle cx="40" cy="48" r="2.5" fill="#0f172a" stroke="none"/>
  <!-- H a la izquierda -->
  <line x1="33" y1="48" x2="22" y2="48" />
  <text x="14" y="52" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#0f172a" stroke="none" text-anchor="end">H</text>
  
  <!-- Grupo Amino (-NH3+) a la derecha -->
  <line x1="47" y1="48" x2="60" y2="48" stroke="#2563eb" stroke-width="2"/>
  <rect x="62" y="36" width="38" height="22" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="81" y="52" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#2563eb" stroke="none" text-anchor="middle">⁺NH₃</text>

  <!-- Enlace C-alfa hacia grupo R -->
  <line x1="40" y1="55" x2="40" y2="72" />
  <circle cx="40" cy="85" r="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="40" y="89" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#334155" stroke="none" text-anchor="middle">R</text>
</g>

        </g>
        <g transform="translate(135, 25)">
          <text x="0" y="0" fill="#0f172a" font-size="16.5" font-weight="800" font-family="'Inter', sans-serif" >L-Aminoácido</text>
          <text x="0" y="18" fill="#0d9488" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace" >Cualquier Aa donador</text>
          <text x="0" y="34" fill="#64748b" font-size="11" font-family="'Inter', sans-serif" >Aporta su grupo ⁺NH₃</text>
        </g>
      </g>
    
      <!-- Metabolito: α-Cetoglutarato -->
      <g id="m_akg_gen" data-arrastrable="1" transform="translate(490, 140)">
        <g transform="translate(0, 0)">
          
<g class="mol-alfacetoglutarato" stroke="#0f172a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- C1: Carboxilato Superior -->
  <text x="40" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#dc2626" stroke="none" text-anchor="middle">COO⁻</text>
  <line x1="40" y1="20" x2="40" y2="36" />

  <!-- C2: Carbonilo C=O -->
  <circle cx="40" cy="43" r="2.5" fill="#0f172a" stroke="none"/>
  <line x1="47" y1="40" x2="66" y2="40" stroke="#dc2626" stroke-width="2"/>
  <line x1="47" y1="44" x2="66" y2="44" stroke="#dc2626" stroke-width="2"/>
  <text x="73" y="46" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#dc2626" stroke="none">O</text>

  <!-- Enlace C2 - C3 -->
  <line x1="40" y1="49" x2="40" y2="62" />

  <!-- C3: -CH2- -->
  <text x="40" y="74" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#0f172a" stroke="none" text-anchor="middle">H₂C</text>
  <line x1="40" y1="80" x2="40" y2="92" />

  <!-- C4: -CH2- -->
  <text x="40" y="104" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#0f172a" stroke="none" text-anchor="middle">H₂C</text>
  <line x1="40" y1="110" x2="40" y2="122" />

  <!-- C5: Carboxilato Inferior -->
  <text x="40" y="136" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#dc2626" stroke="none" text-anchor="middle">COO⁻</text>
</g>

        </g>
        <g transform="translate(135, 25)">
          <text x="0" y="0" fill="#0f172a" font-size="16.5" font-weight="800" font-family="'Inter', sans-serif" >α-Cetoglutarato</text>
          <text x="0" y="18" fill="#0d9488" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace" >5 Carbonos [5C]</text>
          <text x="0" y="34" fill="#64748b" font-size="11" font-family="'Inter', sans-serif" >Aceptor universal en citosol</text>
        </g>
      </g>
    
    <!-- Coenzima PLP y Base de Schiff (Centro) -->
    <g id="plp_focus" data-arrastrable="1" transform="translate(430, 275)">
      <!-- Círculo de aumento -->
      <circle cx="40" cy="40" r="52" fill="#ffffff" stroke="#0d9488" stroke-width="2.2" stroke-dasharray="6 3"/>
      <g transform="translate(0, -10)">
        
<g class="mol-plp" stroke="#0f172a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Anillo de Piridina (Hexágono aromático con Nitrógeno) -->
  <polygon points="40,25 65,39 65,68 40,82 15,68 15,39" fill="#f8fafc" stroke="#0f172a" stroke-width="2.2"/>

  <!-- N en la base del anillo (posición 1 de piridina) -->
  <circle cx="40" cy="82" r="7" fill="#ffffff" stroke="none"/>
  <text x="40" y="86" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#2563eb" stroke="none" text-anchor="middle">N⁺</text>
  <!-- H en nitrógeno -->
  <line x1="40" y1="90" x2="40" y2="98" stroke="#0f172a" stroke-width="1.8"/>
  <text x="40" y="108" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#64748b" stroke="none" text-anchor="middle">H</text>

  <!-- C4 (Arriba): Grupo Aldehído C=O (o Base de Schiff con enzima) -->
  <line x1="40" y1="25" x2="40" y2="10" stroke="#0f172a" stroke-width="2.2"/>
  <text x="40" y="6" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" fill="#dc2626" stroke="none" text-anchor="middle">HC=O</text>
  <text x="40" y="-7" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#0d9488" stroke="none" text-anchor="middle">(Sitio de Unión)</text>

  <!-- C3 (Arriba-derecha): Grupo Fenólico -OH -->
  <line x1="65" y1="39" x2="78" y2="32" stroke="#dc2626" stroke-width="2"/>
  <text x="82" y="34" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#dc2626" stroke="none">O⁻</text>

  <!-- C2 (Abajo-derecha): Grupo Metilo -CH3 -->
  <line x1="65" y1="68" x2="80" y2="76" stroke="#0f172a" stroke-width="2"/>
  <text x="84" y="82" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#0f172a" stroke="none">CH₃</text>

  <!-- C5 (Arriba-izquierda): Cadena hacia el Fosfato (-CH2-O-P) -->
  <line x1="15" y1="39" x2="-2" y2="30" stroke="#0f172a" stroke-width="2"/>
  <circle cx="-16" cy="22" r="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="-16" y="27" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#c2410c" stroke="none" text-anchor="middle">Ⓟ</text>
  <text x="-36" y="26" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#ea580c" stroke="none" text-anchor="end">O-PO₃²⁻</text>
</g>

      </g>
      <!-- Texto explicativo -->
      <text x="40" y="112" fill="#0f172a" font-size="12" font-weight="800" font-family="'Inter', sans-serif" text-anchor="middle">Aminotransferasa (Transaminasa)</text>
      <text x="40" y="127" fill="#0d9488" font-size="10.5" font-weight="700" font-family="'Inter', sans-serif" text-anchor="middle">Coenzima: Piridoxal Fosfato (PLP)</text>
      <text x="40" y="141" fill="#64748b" font-size="9.5" font-family="'Inter', sans-serif" text-anchor="middle">Forma Base de Schiff con Lys de la enzima</text>
    </g>
    
    <!-- Arcos cruzados de transferencia de nitrógeno -->
    <g id="arcos_transaminacion_gen" data-arrastrable="1" stroke-linecap="round" fill="none">
      <!-- Camino 1: Aminoácido ➔ α-Cetoácido (Pierde NH3+) -->
      <path d="M 180 240 Q 220 350 190 450" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrowFlow)"/>
      <path d="M 175 450 Q 205 350 165 240" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrowFlow)"/>
      <text x="135" y="350" fill="#0f766e" font-size="11" font-weight="800" font-family="'Inter', sans-serif">Transfiere ⁺NH₃</text>

      <!-- Camino 2: α-Cetoglutarato ➔ L-Glutamato (Gana NH3+) -->
      <path d="M 640 240 Q 600 350 630 450" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlueAmino)"/>
      <path d="M 645 450 Q 615 350 655 240" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrowBlueAmino)"/>
      <text x="705" y="350" fill="#1d4ed8" font-size="11" font-weight="800" font-family="'Inter', sans-serif">Recolecta ⁺NH₃</text>
    </g>
    
      <!-- Metabolito: α-Cetoácido -->
      <g id="m_ceto_gen" data-arrastrable="1" transform="translate(70, 470)">
        <g transform="translate(0, 0)">
          
<g class="mol-alfacetoacido-gen" stroke="#0f172a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- C1: Carboxilato Superior -->
  <text x="40" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#dc2626" stroke="none" text-anchor="middle">COO⁻</text>
  <line x1="40" y1="22" x2="40" y2="40" />

  <!-- C2: C=O (Grupo ceto / carbonilo en alfa) -->
  <circle cx="40" cy="48" r="2.5" fill="#0f172a" stroke="none"/>
  <line x1="47" y1="45" x2="66" y2="45" stroke="#dc2626" stroke-width="2"/>
  <line x1="47" y1="49" x2="66" y2="49" stroke="#dc2626" stroke-width="2"/>
  <text x="73" y="51" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#dc2626" stroke="none">O</text>

  <!-- Enlace C2 hacia grupo R -->
