<!DOCTYPE html>
<html lang="es">

  <style>

      background: #e2e8f0;
      color: #0f172a;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lienzo-svg {
      width: 1100px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);

    }
    svg { display: block; width: 100%; height: auto; }

</head>
<body>
  <div class="lienzo-svg">
    <svg width="1100" height="2250" viewBox="0 0 1100 2250" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Flecha de flujo metabólico principal (Ámbar / Naranja) -->

          <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#dc2626" />

    <!-- Gradiente del Citosol Celular Hepático (arriba) -->
    <linearGradient id="gradCitosolCeto" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="1" />
      <stop offset="60%" stop-color="#f0fdf4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.9" />

    <!-- Gradiente de la Matriz Mitocondrial Hepática (Cálido y Luminoso) -->

      <stop offset="50%" stop-color="#ffedd5" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.9" />
    </linearGradient>

    <!-- Gradiente del Capilar Sanguíneo en la Lupa -->

      <stop offset="100%" stop-color="#fecdd3" stop-opacity="0.7" />

      <stop offset="70%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.8" />
    </radialGradient>

    <!-- Marco de lente de la Lupa de aumento -->

        <circle cx="-218" cy="0" r="6" fill="#0284c7"/>

        </text>

      <!-- Subtítulo de especificidad enzimática colocado discretamente bajo el capilar -->
      <text x="0" y="-420" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#0284c7" text-anchor="middle">
        Oxidación mitocondrial periférica dependiente de Tioforasa (SCOT / OXCT1)
      </text>
    </g>
    

    <!-- Metabolito: 2 x Acetil-CoA -->
    <g id="ceto-met-2acetilcoa" data-arrastrable="1" transform="translate(280, 95)">

<g class="mol-acetil-coa" stroke="#0f172a" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">

      <g transform="translate(210, 25)">

        <text x="0" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ea580c">[2C cada uno] Exceso proveniente de β-oxidación</text>
      </g>
    </g>
    

    <path d="M 380 160 L 380 220" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#arrowFlow)"/>

      <circle cx="-12" cy="-4" r="9" fill="#0f172a" />

    <path d="M 380 300 L 380 370" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#arrowFlow)"/>

<g class="mol-hmg-coa" stroke="#0f172a" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
